{% load static %}

<style>
  /* Light Theme Header Styles - Unified for all pages including homepage */
  .header {
    --background-color: rgba(255, 255, 255, 0.98) !important;
    --default-color: #2c3e4e !important;
    --heading-color: #1a2c38 !important;
    background-color: rgba(255, 255, 255, 0.98) !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.02);
    transition: all 0.3s ease;
  }

  /* Remove any dark overlay on homepage */
  body.page-home .header {
    --background-color: rgba(255, 255, 255, 0.98) !important;
    background-color: rgba(255, 255, 255, 0.98) !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  /* Ensure hero section doesn't conflict with header visibility */
  body.page-home .hero {
    padding-top: 100px;
  }

  .scrolled .header {
    --background-color: #ffffff !important;
    background-color: #ffffff !important;
    box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  }

  /* Logo Styling - Light Version */
  .logo {
    background-color: transparent;
    padding: 5px 0;
    border-radius: 8px;
    transition: all 0.3s ease;
    overflow: hidden;
  }

  .logo img {
    max-height: 55px;
    width: auto;
    display: block;
    transition: transform 0.3s ease;
    filter: brightness(1);
  }

  .logo:hover img {
    transform: scale(1.05);
  }

  .scrolled .logo {
    padding: 4px 0;
  }

  .scrolled .logo img {
    max-height: 50px;
  }

  /* Keep logo transparent on homepage too */
  body.page-home .logo {
    background-color: transparent;
  }

  body.page-home .scrolled .logo {
    background-color: transparent;
  }

  /* Navbar Links - Light Theme - Consistent across all pages */
  .navmenu a,
  .navmenu a:focus {
    color: #2c3e4e !important;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.3px;
  }

  .navmenu a:hover,
  .navmenu .active,
  .navmenu .active:focus {
    color: #2c9b6b !important;
  }

  /* Underline Animation - Light Theme */
  @media (min-width: 1200px) {
    .navmenu > ul > li > a {
      position: relative;
    }
    
    .navmenu > ul > li > a::after {
      content: '';
      position: absolute;
      bottom: 12px;
      left: 15px;
      width: 0%;
      height: 2px;
      background-color: #2c9b6b;
      transition: width 0.3s ease;
    }

    .navmenu > ul > li:hover > a::after,
    .navmenu > ul > li > a.active::after {
      width: calc(100% - 30px);
    }

    .navmenu .dropdown ul {
      background: #ffffff;
      border-top: 3px solid #2c9b6b;
      border-radius: 0 0 12px 12px;
      padding: 8px 0;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      min-width: 250px;
    }

    .navmenu .dropdown ul li {
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .navmenu .dropdown ul li:last-child {
      border-bottom: none;
    }

    .navmenu .dropdown ul a {
      padding: 11px 20px 11px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #2c3e4e;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid transparent;
      transition: all 0.25s ease;
    }

    .navmenu .dropdown ul li:hover > a {
      color: #2c9b6b;
      background-color: #f8fffc;
      border-left-color: #2c9b6b;
      padding-left: 20px;
    }

    .navmenu .dropdown ul a i {
      font-size: 15px;
      color: #2c9b6b;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .navmenu .dropdown ul li:hover > a i {
      color: #2c9b6b;
    }

    .navmenu .dropdown ul a::after {
      content: '\F285';
      font-family: "bootstrap-icons";
      margin-left: auto;
      font-size: 11px;
      color: #bdc3c7;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .navmenu .dropdown ul li:hover > a::after {
      color: #2c9b6b;
      transform: translateX(3px);
    }
  }

  /* Mobile Nav - Light Theme */
  @media (max-width: 1199px) {
    .mobile-nav-toggle {
      color: #2c3e4e !important;
    }

    .navmenu ul {
      background-color: #ffffff !important;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
    }

    .navmenu a,
    .navmenu a:focus {
      color: #2c3e4e !important;
    }

    .navmenu a:hover,
    .navmenu .active,
    .navmenu .active:focus {
      color: #2c9b6b !important;
    }

    .mobile-nav-active .mobile-nav-toggle {
      color: #2c3e4e !important;
    }

    .mobile-nav-active .navmenu {
      background: rgba(255, 255, 255, 0.96) !important;
    }
    
    /* Ensure mobile menu social icons are visible */
    .mobile-nav-social {
      display: flex !important;
    }
  }

  /* Button Styling - Light Theme */
  .btn-getstarted,
  .btn-getstarted:focus {
    color: #ffffff !important;
    background: #2c9b6b !important;
    font-size: 14px;
    padding: 10px 28px;
    margin: 0 0 0 20px;
    border-radius: 30px;
    transition: all 0.3s ease;
    font-weight: 500;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(44, 155, 107, 0.2);
    text-decoration: none;
    display: inline-block;
  }

  .btn-getstarted:hover,
  .btn-getstarted:focus:hover {
    background: #238b5e !important;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(44, 155, 107, 0.3);
    color: #ffffff !important;
  }

  /* Social Icons Container - Right Side */
  .header-social-icons {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: 20px;
  }

  .header-social-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background-color: #f8f9fa;
    color: #2c9b6b;
    font-size: 16px;
    transition: all 0.3s ease;
    text-decoration: none;
    border: 1px solid #e9ecef;
  }

  .header-social-icons a:hover {
    background-color: #2c9b6b;
    color: #ffffff;
    transform: translateY(-2px);
    border-color: #2c9b6b;
  }

  /* Responsive Adjustments */
  @media (max-width: 1200px) {
    .header-social-icons {
      margin-left: 10px;
      gap: 8px;
    }
    
    .header-social-icons a {
      width: 32px;
      height: 32px;
      font-size: 14px;
    }
    
    .btn-getstarted {
      margin: 0 10px 0 0;
      padding: 8px 20px;
    }
  }

  @media (max-width: 768px) {
    .logo img {
      max-height: 45px;
    }
    
    .header-social-icons {
      display: none; /* Hide on mobile, show in mobile menu if needed */
    }
    
    /* Mobile menu social icons */
    .mobile-nav-social {
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      margin-top: 20px;
    }
    
    .mobile-nav-social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #f8f9fa;
      color: #2c9b6b;
      font-size: 18px;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    
    .mobile-nav-social a:hover {
      background-color: #2c9b6b;
      color: #ffffff;
      transform: translateY(-2px);
    }
  }

  /* Dropdown Active State */
  .navmenu .dropdown .dropdown-active {
    background-color: rgba(44, 155, 107, 0.02);
  }

  /* Ensure header is above all content */
  .header {
    z-index: 1030;
  }
  
  /* Fix for hero section spacing on homepage */
  .hero {
    padding-top: 100px;
  }
</style>

<script>
  // Ensure light theme works on homepage and handle mobile menu
  document.addEventListener('DOMContentLoaded', function() {
    const mobileToggle = document.querySelector('.mobile-nav-toggle');
    const navmenu = document.querySelector('.navmenu');
    
    if (mobileToggle && navmenu) {
      mobileToggle.addEventListener('click', function() {
        setTimeout(function() {
          const mobileSocial = document.querySelector('.mobile-nav-social');
          const navmenuUl = document.querySelector('.navmenu > ul');
          if (mobileSocial && navmenuUl && document.body.classList.contains('mobile-nav-active')) {
            // Ensure mobile social is at the bottom of the menu
            if (!navmenuUl.parentNode.querySelector('.mobile-nav-social')) {
              navmenuUl.after(mobileSocial);
            }
          }
        }, 50);
      });
    }
    
    // Add smooth scroll offset for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          e.preventDefault();
          const headerOffset = 90;
          const elementPosition = target.getBoundingClientRect().top;
          const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
          
          window.scrollTo({
            top: offsetPosition,
            behavior: "smooth"
          });
        }
      });
    });
  });
</script>
