{% load static %}

<style>
  .header {
    background-color: #ffffff !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
    padding: 0;
    transition: box-shadow 0.3s ease, background-color 0.3s ease;
    z-index: 1030;
  }

  .scrolled .header {
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.09);
  }

  body.page-home .hero {
    padding-top: 80px;
  }

  .header .container-fluid {
    padding-top: 10px;
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Logo */
  .header .logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding: 4px 0;
    margin: 0 auto; /* center logo */
  }

  .header .logo img {
    height: 52px;
    width: auto;
    display: block;
    object-fit: contain;
    transition: transform 0.25s ease;
  }

  .header .logo:hover img {
    transform: scale(1.03);
  }

  @media (max-width: 575px) {
    .header .logo img {
      height: 42px;
    }
  }

  /* Nav menu */
  .navmenu {
    display: flex;
    align-items: center;
  }

  .navmenu ul {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 20px;
  }

  .navmenu a {
    color: #2c3e4e;
    font-family: var(--nav-font);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
  }

  .navmenu a:hover,
  .navmenu .active {
    color: var(--accent-color);
  }

  /* Mobile */
  @media (max-width: 1199px) {
    .navmenu ul {
      flex-direction: column;
      display: none;
      padding: 20px;
      gap: 12px;
    }

    .mobile-nav-active .navmenu ul {
      display: flex;
    }

    .mobile-nav-toggle {
      font-size: 26px;
      color: #2c3e4e;
      cursor: pointer;
      margin-left: auto;
    }

    /* Move get a quote into mobile menu */
    .mobile-quote-btn {
      display: block;
      margin: 12px 0;
    }

    .header-social,
    .mobile-nav-social {
      display: none; /* hide all social icons on mobile */
    }

    .header .logo {
      margin: 0; /* reset center for flex container */
    }
  }

  .btn-getstarted {
    color: #ffffff !important;
    background: var(--accent-color) !important;
    font-family: var(--nav-font);
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 24px;
    border-radius: 6px;
    border: 2px solid var(--accent-color);
    text-decoration: none;
    transition: all 0.25s ease;
  }

  .btn-getstarted:hover {
    background: transparent !important;
    color: var(--accent-color) !important;
  }
</style>

<header id="header" class="header d-flex align-items-center fixed-top">
  <div class="container-fluid container-xl position-relative d-flex align-items-center justify-content-between">

    <!-- Logo center -->
    <a href="{% url 'home' %}" class="logo d-flex align-items-center">
      <img src="{% static 'img/logo.png' %}" alt="Radiant Infotech Nepal">
    </a>

    <!-- Hamburger toggle -->
    <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>

    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a></li>
        <li><a href="{% url 'about_us' %}" class="{% if request.resolver_match.url_name == 'about_us' %}active{% endif %}">About Us</a></li>
        <li class="dropdown">
          <a href="{% url 'services' %}" class="{% if 'service' in request.resolver_match.url_name %}active{% endif %}">
            Our Services <i class="bi bi-chevron-down toggle-dropdown"></i>
          </a>
          <ul>
            <li><a href="{% url 'service_detail' slug='digital-signature' %}"><i class="bi bi-patch-check-fill"></i> Digital Signature</a></li>
            <li><a href="{% url 'service_detail' slug='web-development' %}"><i class="bi bi-code-slash"></i> Web Development</a></li>
            <li><a href="{% url 'service_detail' slug='software-development' %}"><i class="bi bi-phone-fill"></i> Software Development</a></li>
            <li><a href="{% url 'service_detail' slug='ict-support' %}"><i class="bi bi-headset"></i> ICT & IT Support</a></li>
            <li><a href="{% url 'service_detail' slug='mis-solutions' %}"><i class="bi bi-graph-up"></i> MIS</a></li>
            <li><a href="{% url 'service_detail' slug='digital-marketing' %}"><i class="bi bi-megaphone"></i> SEO & Digital Marketing</a></li>
            <li><a href="{% url 'service_detail' slug='graphics-designing' %}"><i class="bi bi-palette-fill"></i> Graphics Designing</a></li>
          </ul>
        </li>
        <li><a href="{% url 'gallery' %}" class="{% if request.resolver_match.url_name == 'gallery' %}active{% endif %}">Gallery</a></li>
        <li><a href="{% url 'career' %}" class="{% if request.resolver_match.url_name == 'career' %}active{% endif %}">Career</a></li>
        <li><a href="{% url 'contact_us' %}" class="{% if request.resolver_match.url_name == 'contact_us' %}active{% endif %}">Contact Us</a></li>

        <!-- Mobile only get a quote -->
        <li class="d-xl-none">
          <a href="{% url 'contact_us' %}" class="btn-getstarted mobile-quote-btn">Get a Quote</a>
        </li>
      </ul>
    </nav>

    <!-- Desktop button -->
    <div class="d-none d-xl-flex align-items-center">
      <a class="btn-getstarted" href="{% url 'contact_us' %}">Get a Quote</a>

      <div class="header-social">
        <a href="https://www.facebook.com/radiantinfotech" target="_blank" rel="noopener"><i class="bi bi-facebook"></i></a>
        <a href="https://twitter.com/radiantinfotech" target="_blank" rel="noopener"><i class="bi bi-twitter-x"></i></a>
        <a href="https://www.linkedin.com/company/radiant-infotech" target="_blank" rel="noopener"><i class="bi bi-linkedin"></i></a>
        <a href="https://www.instagram.com/radiantinfotech" target="_blank" rel="noopener"><i class="bi bi-instagram"></i></a>
        <a href="https://www.youtube.com/@radiantinfotech" target="_blank" rel="noopener"><i class="bi bi-youtube"></i></a>
      </div>
    </div>

  </div>
</header>

<script>
  // Smooth scroll for anchor links
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
      anchor.addEventListener('click', function (e) {
        var target = document.querySelector(this.getAttribute('href'));
        if (target) {
          e.preventDefault();
          var offset = document.querySelector('#header').offsetHeight + 10;
          var top = target.getBoundingClientRect().top + window.pageYOffset - offset;
          window.scrollTo({ top: top, behavior: 'smooth' });
        }
      });
    });

    // Mobile menu toggle
    const toggle = document.querySelector('.mobile-nav-toggle');
    const nav = document.querySelector('#navmenu');
    toggle.addEventListener('click', () => {
      nav.classList.toggle('mobile-nav-active');
    });
  });
</script>
